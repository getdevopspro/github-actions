name: Build Report
description: Aggregate test, lint, and coverage artifacts into an HTML report and GitHub summary.
inputs:
  artifact-names:
    description: Newline-separated names of the report artifacts from this run. Each artifact must contain supported results.
    required: true
  artifact-name:
    description: Name of the uploaded HTML report artifact.
    default: build-report
  artifact-sections:
    description: JSON object mapping artifact names to sections with id and title. Artifact section_title overrides the title; content supplies tests, lint, and coverage.
    default: '{}'
  pr-comment:
    description: Update the build report comment on pull requests. Requires pull-requests write permission.
    default: 'false'
  baseline-artifact:
    description: Optional report artifact from the latest successful baseline run, used for coverage comparison.
    default: ''
  baseline-workflow:
    description: Workflow filename or ID used to find the coverage baseline.
    default: release.yml
  github-token:
    description: GitHub token for optional baseline lookup and PR comments.
    default: ${{ github.token }}
outputs:
  artifact-url:
    description: URL of the uploaded HTML report.
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-id:
    description: ID of the uploaded HTML report.
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Prepare report inputs
      id: prepare
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT_ARTIFACT_NAMES: ${{ inputs.artifact-names }}
        REPORT_ARTIFACT_SECTIONS: ${{ inputs.artifact-sections }}
      run: |
        set -euo pipefail
        python3 "$ACTION_PATH/collect.py" prepare

    - name: Download report artifacts
      id: download
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: ${{ steps.prepare.outputs.name }}
        pattern: ${{ steps.prepare.outputs.pattern }}
        path: ${{ steps.prepare.outputs.download-path }}
        merge-multiple: false

    - name: Find coverage baseline
      id: baseline
      if: inputs.baseline-artifact != ''
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        BASELINE_WORKFLOW: ${{ inputs.baseline-workflow }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          try {
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: process.env.BASELINE_WORKFLOW,
              branch: context.payload.repository.default_branch,
              status: 'success', per_page: 1,
            });
            const run = data.workflow_runs[0];
            if (run) core.setOutput('run-id', run.id);
          } catch (error) {
            // Generate report emits one warning if the optional baseline is unusable.
            core.info(`Coverage baseline lookup failed (HTTP ${error.status ?? 'unknown'})`);
          }

    - name: Download coverage baseline
      if: steps.baseline.outputs.run-id != ''
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.baseline-artifact }}
        path: ${{ steps.prepare.outputs.root }}/baseline
        run-id: ${{ steps.baseline.outputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Generate report
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT_ROOT: ${{ steps.prepare.outputs.root }}
        REPORT_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        REPORT_BASELINE_REQUESTED: ${{ inputs.baseline-artifact != '' }}
      run: |
        set -euo pipefail
        python3 "$ACTION_PATH/collect.py" generate --root "$REPORT_ROOT"

    - name: Upload HTML report
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.prepare.outputs.html }}
        archive: false
        if-no-files-found: error

    - name: Publish job summary
      shell: bash
      env:
        REPORT_MARKDOWN: ${{ steps.prepare.outputs.markdown }}
        REPORT_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        set -euo pipefail
        cat "$REPORT_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$REPORT_ARTIFACT_URL" ]; then
          printf '\n[Download the full HTML report](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Update PR report comment
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT_MARKDOWN: ${{ steps.prepare.outputs.markdown }}
        REPORT_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await require(`${process.env.ACTION_PATH}/comment.js`)({github, context, core});

    - name: Check report results
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT_ROOT: ${{ steps.prepare.outputs.root }}
      run: |
        set -euo pipefail
        python3 "$ACTION_PATH/collect.py" check --root "$REPORT_ROOT"
