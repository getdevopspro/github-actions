name: Build Report
description: Aggregate test, lint, and coverage artifacts into an HTML report and GitHub summary.
inputs:
  artifact-names:
    description: Newline-separated names of the report artifacts from this run. Each artifact must contain supported results.
    required: true
  artifact-name:
    description: Name of the uploaded HTML report artifact.
    default: build-report
  artifact-sections:
    description: JSON object mapping artifact names to sections with id and title. Artifact section_title overrides the title; content supplies tests, lint, and coverage.
    default: '{}'
  pr-comment:
    description: Update the build report comment on pull requests. Requires pull-requests write permission.
    default: 'false'
  github-token:
    description: GitHub token for optional PR comments.
    default: ${{ github.token }}
outputs:
  artifact-url:
    description: URL of the uploaded HTML report.
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-id:
    description: ID of the uploaded HTML report.
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Prepare report inputs
      id: prepare
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT_ARTIFACT_NAMES: ${{ inputs.artifact-names }}
        REPORT_ARTIFACT_SECTIONS: ${{ inputs.artifact-sections }}
      run: |
        set -euo pipefail
        python3 "$ACTION_PATH/collect.py" prepare

    - name: Download report artifacts
      id: download
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: ${{ steps.prepare.outputs.name }}
        pattern: ${{ steps.prepare.outputs.pattern }}
        path: ${{ steps.prepare.outputs.download-path }}
        merge-multiple: false

    - name: Generate report
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT_ROOT: ${{ steps.prepare.outputs.root }}
        REPORT_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
      run: |
        set -euo pipefail
        python3 "$ACTION_PATH/collect.py" generate --root "$REPORT_ROOT"

    - name: Upload HTML report
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.prepare.outputs.html }}
        archive: false
        if-no-files-found: error

    - name: Publish job summary
      shell: bash
      env:
        REPORT_MARKDOWN: ${{ steps.prepare.outputs.markdown }}
        REPORT_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        set -euo pipefail
        cat "$REPORT_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$REPORT_ARTIFACT_URL" ]; then
          printf '\n[Download the full HTML report](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Update PR report comment
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v8
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT_MARKDOWN: ${{ steps.prepare.outputs.markdown }}
        REPORT_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await require(`${process.env.ACTION_PATH}/comment.js`)({github, context, core});

    - name: Check report results
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORT_ROOT: ${{ steps.prepare.outputs.root }}
      run: |
        set -euo pipefail
        python3 "$ACTION_PATH/collect.py" check --root "$REPORT_ROOT"
