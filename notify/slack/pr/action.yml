name: Notify Slack - Pull Request
description: Send a Slack notification for a pull request build result using an inline YAML payload.

inputs:
  job-status:
    description: Status of the upstream job (success, failure, cancelled, etc.)
    required: true
  slack-webhook-url:
    description: Slack incoming webhook URL
    required: true
  artifact-link-name:
    description: Optional label for an artifact link to include in the Slack message (e.g. "Build Report"). Requires artifact-link-url.
    required: false
    default: ''
  artifact-link-url:
    description: Optional URL for an artifact link. Requires artifact-link-name.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Post message to Slack
      uses: slackapi/slack-github-action@v3
      with:
        webhook: ${{ inputs.slack-webhook-url }}
        webhook-type: incoming-webhook
        payload-templated: true
        payload: |
          blocks:
            - type: header
              text:
                type: plain_text
                text: "${{ inputs.job-status == 'success' && '✅' || '❌' }} Pull Request Build - ${{ inputs.job-status == 'success' && 'SUCCESS' || 'FAILED' }}"
                emoji: true
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Repository*\n`${{ github.repository }}`"
                - type: mrkdwn
                  text: "*Author*\n`${{ github.actor }}`"
                - type: mrkdwn
                  text: "*PR*\n<${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}>"
                - type: mrkdwn
                  text: "*Commit SHA*\n`${{ github.sha }}`"
            - type: context
              elements:
                - type: mrkdwn
                  text: "${{ (inputs.artifact-link-name != '' && inputs.artifact-link-url != '') && format('<{0}|{1}>  |  ', inputs.artifact-link-url, inputs.artifact-link-name) || '' }}<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run Report>"
