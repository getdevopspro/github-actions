name: Go Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: GolangCI Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.22

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
