name: Build cache

on:
  pull_request:
    paths:
      - 'buildx-bake/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-cache.self.yml'
      - 'tests/fixtures/build-cache/**'
      - 'tests/test_build_cache.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_SCOPE: fixture-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - id: prepare
        uses: ./buildx-bake/prepare
        with:
          bake-file: tests/fixtures/build-cache/docker-bake.hcl
          registry-image: ghcr.io/example/cache-fixture
          meta-tags: type=sha

  cold:
    timeout-minutes: 10
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
      - name: Populate target/platform caches using the candidate action
        uses: ./buildx-bake/build
        with:
          bake-file: tests/fixtures/build-cache/docker-bake.hcl
          dockerfile: tests/fixtures/build-cache/Dockerfile
          cache-scope: ${{ env.CACHE_SCOPE }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          bake-set: '*.output=type=cacheonly'
      - name: Check resolved scopes and caller overrides
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 tests/test_build_cache.py defaults
      - uses: actions/upload-artifact@v7
        with:
          name: cache-defaults-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/bake-defaults.json
          retention-days: 1

  warm:
    timeout-minutes: 10
    # Wait for ALL cold exporters to finish: a shared scope would lose a writer.
    needs: [prepare, cold]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: cache-defaults-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: bake-meta
          path: ${{ runner.temp }}
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Check warm reuse and invalidation on fresh builders
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 tests/test_build_cache.py warm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cache-measurements-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/cache-measurements.json
          retention-days: 7
