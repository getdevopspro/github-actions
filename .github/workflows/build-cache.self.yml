name: Build cache

on:
  pull_request:
    paths:
      - 'buildx-bake/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-cache.self.yml'
      - 'tests/fixtures/build-cache/**'
      - 'tests/test_build_cache.py'
      - 'tests/test_build_cache_config.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_SCOPE: fixture-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Check cache configuration
        run: python3 -B -m unittest discover -s tests -p 'test_build_cache_config.py' -v
      - uses: docker/setup-buildx-action@v4
      - id: prepare
        uses: ./buildx-bake/prepare
        with:
          bake-file: tests/fixtures/build-cache/docker-bake.hcl
          registry-image: ghcr.io/example/cache-fixture
          meta-tags: type=sha

  cold:
    timeout-minutes: 10
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
      - name: Populate target/platform caches using the candidate action
        uses: ./buildx-bake/build
        with:
          bake-file: tests/fixtures/build-cache/docker-bake.hcl
          dockerfile: tests/fixtures/build-cache/Dockerfile
          cache-mounts: false
          cache-scope: ${{ env.CACHE_SCOPE }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          bake-set: '*.output=type=cacheonly'
      - name: Check mount-cache opt-out
        run: test ! -e cache-mount
      - name: Check resolved scopes and caller overrides
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 tests/test_build_cache.py defaults
      - uses: actions/upload-artifact@v7
        with:
          name: cache-defaults-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/bake-defaults.json
          retention-days: 1

  warm:
    timeout-minutes: 10
    # Wait for ALL cold exporters to finish: a shared scope would lose a writer.
    needs: [prepare, cold]
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: cache-defaults-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: bake-meta
          path: ${{ runner.temp }}
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Check warm reuse and invalidation on fresh builders
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 tests/test_build_cache.py warm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cache-measurements-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/cache-measurements.json
          retention-days: 7

  mount-cold:
    timeout-minutes: 10
    needs: prepare
    runs-on: ubuntu-24.04-arm
    strategy: &mount-platform
      matrix:
        platform: [linux/arm64]
    env:
      MOUNT_GENERATION: '1'
    steps: &mount-steps
      - uses: actions/checkout@v6
      - name: Select source generation
        run: printf '%s\n' "$MOUNT_GENERATION" > tests/fixtures/build-cache/mount-generation.txt
      - name: Check mount restoration, ownership and update
        uses: ./buildx-bake/build
        with:
          bake-file: tests/fixtures/build-cache/mounts.hcl
          dockerfile: tests/fixtures/build-cache/Dockerfile.mounts
          cache-scope: ${{ env.CACHE_SCOPE }}-mounts
          cache-map: |
            {
              "cache-mount/fixture": {
                "target": "/home/builder/.cache/fixture",
                "id": "fixture-${TARGETARCH}",
                "uid": 1000,
                "gid": 1000,
                "sharing": "locked"
              }
            }
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          bake-set: |
            *.cache-from=
            *.cache-to=
            *.output=type=cacheonly

  mount-restore:
    timeout-minutes: 10
    needs: mount-cold
    runs-on: ubuntu-24.04-arm
    strategy: *mount-platform
    env:
      MOUNT_GENERATION: '2'
    steps: *mount-steps

  mount-refresh:
    timeout-minutes: 10
    needs: mount-restore
    runs-on: ubuntu-24.04-arm
    strategy: *mount-platform
    env:
      MOUNT_GENERATION: '3'
    steps: *mount-steps

  emulated:
    timeout-minutes: 10
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - platform: linux/arm64
            qemu: auto
            dockerfile: Dockerfile
          - platform: linux/amd64
            qemu: 'true'
            dockerfile: Dockerfile.foreign
    steps:
      - uses: actions/checkout@v6
      - name: Check automatic and forced foreign execution
        uses: ./buildx-bake/build
        with:
          bake-file: tests/fixtures/build-cache/docker-bake.hcl
          dockerfile: tests/fixtures/build-cache/Dockerfile
          cache-mounts: false
          qemu: ${{ matrix.qemu }}
          cache-scope: ${{ env.CACHE_SCOPE }}-emulated
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          bake-set: |
            *.dockerfile=${{ matrix.dockerfile }}
            *.cache-from=
            *.cache-to=
            *.output=type=cacheonly

  all-green:
    name: Job
    needs: [prepare, cold, warm, mount-cold, mount-restore, mount-refresh, emulated]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      checks: read
    uses: ./.github/workflows/all-green.yml
