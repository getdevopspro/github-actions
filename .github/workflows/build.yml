name: Build

on:
  workflow_call:
    secrets:
      registry-password:
        description: 'Password or token for registry login'
        required: false
      checkout-token:
        description: 'Checkout token with repo permissions'
        required: false
    outputs:
      version:
        description: 'Detected or calculated version'
        value: ${{ jobs.prepare.outputs.version }}
      commit-sha:
        description: 'The commit SHA being built'
        value: ${{ jobs.prepare.outputs.commit-sha }}
      image-digests:
        description: 'JSON with all merged image manifest digests'
        value: ${{ jobs.image-push.outputs.image-digests }}
      build-report-url:
        description: 'URL of the HTML build report, when reporting is enabled'
        value: ${{ jobs.build-report.outputs.artifact-url }}
    inputs:
      version-strategy:
        description: 'Versioning strategy: semver or calver'
        required: false
        default: 'semver'
        type: string
      version-semver-previous:
        description: 'SemVer only: strategy to detect the previous version: auto, from-tag, from-file or manual'
        required: false
        default: 'auto'
        type: string
      version-semver-next:
        description: 'SemVer only: strategy to calculate the next version: auto, semantic, from-file, increment or manual'
        required: false
        default: 'auto'
        type: string
      version-output-format:
        description: 'Output template; CalVer maps {{.Major}}, {{.Minor}}, and {{.Patch}} to year, month, and patch'
        required: false
        default: '{{.Major}}.{{.Minor}}.{{.Patch}}-build'
        type: string
      version-tag-prefix:
        description: 'The prefix for the new tag - prefixed before the output'
        required: false
        default: 'v'
        type: string
      version-file:
        description: 'Set version in file named as input'
        required: false
        type: string
      version-galaxy:
        description: 'Set the collection version in the galaxy.yml file named as input'
        required: false
        type: string
      version-makefile:
        description: 'Set version in makefile named as input'
        required: false
        type: string
      version-justfile:
        description: 'Set version in justfile named as input'
        required: false
        type: string
      version-package:
        description: 'Set version in package json named as input'
        required: false
        type: string
      version-package-lock:
        description: 'Set version in package lock named as input'
        required: false
        type: string
      version-script:
        description: 'Set version in script named as input'
        required: false
        type: string
      version-chart:
        description: 'Set version in chart named as input'
        required: false
        type: string
      bake-file:
        description: 'The bake file'
        required: false
        type: string
        default: 'docker-bake.hcl'
      bake-target:
        description: 'Target name for `docker buildx bake`'
        required: false
        type: string
        default: 'build'
      qemu:
        description: 'QEMU setup: auto for foreign platforms, true to force, false to skip'
        required: false
        type: string
        default: 'auto'
      cache-mounts:
        description: 'Persist Dockerfile cache mounts between builds'
        required: false
        type: boolean
        default: true
      cache-map:
        description: 'Optional JSON map of cache-mount/<name> paths to resolved mount options; replaces discovery'
        required: false
        type: string
        default: ''
      dockerfile:
        description: 'Dockerfile used for cache-mount discovery and archive compatibility'
        required: false
        type: string
        default: 'Dockerfile'
      cache-scope:
        description: 'Layer-cache prefix; target name and platform are appended'
        required: false
        type: string
        default: 'buildkit'
      bake-set:
        description: 'Newline-separated Bake overrides, applied after the action defaults'
        required: false
        type: string
        default: ''
      meta-tags:
        description: 'The tags to add to the image'
        required: false
        type: string
      meta-labels:
        description: 'The labels to add to the image'
        required: false
        type: string
      registry:
        description: 'The container registry'
        required: false
        default: 'ghcr.io'
        type: string
      registry-image:
        description: 'Container registry + image prefix (e.g. ghcr.io/org/repo)'
        required: false
        default: ghcr.io/${{ github.repository }}
        type: string
      registry-username:
        description: 'The container registry username'
        required: false
        default: ${{ github.actor }}
        type: string
      runner-default:
        description: 'Global fallback runner used when no more specific runner input applies'
        required: false
        type: string
        default: 'ubuntu-22.04'
      runner-prepare-default:
        description: 'Default runner for prepare job. Fallback chain: runner-prepare-default -> runner-default'
        required: false
        type: string
        default: 'ubuntu-22.04'
      runner-build-arm64:
        description: 'Runner for linux/arm64 image builds'
        required: false
        type: string
        default: 'ubuntu-22.04-arm'
      runner-build-amd64:
        description: 'Runner for linux/amd64 image builds. Fallback chain: runner-build-amd64 -> runner-default'
        required: false
        type: string
        default: 'ubuntu-22.04'
      runner-pre-default:
        description: 'Default runner for pre-steps. Fallback chain: pre-<step>-runner -> runner-pre-default -> runner-default'
        required: false
        type: string
        default: ''
      runner-post-default:
        description: 'Default runner for post-steps. Fallback chain: post-<step>-runner -> runner-post-default -> runner-default'
        required: false
        type: string
        default: ''
      free-disk-space:
        description: 'Free disk space before build'
        required: false
        default: false
        type: boolean
      docker-version:
        description: 'Docker CE version. (e.g, v24.0.9)'
        required: false
        default: ''
        type: string
      compose-version:
        description: 'Compose version. (eg. v2.32.4)'
        required: false
        default: ''
        type: string
      pre-docker-version:
        description: 'Docker CE version for pre-steps. Defaults to docker-version.'
        required: false
        default: ''
        type: string
      pre-compose-version:
        description: 'Compose version for pre-steps. Defaults to compose-version.'
        required: false
        default: ''
        type: string
      post-docker-version:
        description: 'Docker CE version for post-steps. Defaults to docker-version.'
        required: false
        default: ''
        type: string
      post-compose-version:
        description: 'Compose version for post-steps. Defaults to compose-version.'
        required: false
        default: ''
        type: string
      baseline-enabled:
        description: 'Retrieve a baseline once for repository pre/post commands; requires caller actions read permission'
        required: false
        type: boolean
        default: false
      baseline-artifact:
        description: 'Exact reference artifact name; required when baseline-enabled is true'
        required: false
        type: string
      baseline-workflow:
        description: 'Workflow filename or ID producing the reference artifact'
        required: false
        type: string
        default: 'release.yml'
      baseline-allow-ancestor:
        description: 'Allow an approximate baseline from a bounded first-parent ancestor search'
        required: false
        type: boolean
        default: false
      build-report-enabled:
        description: 'Generate a build report from configured pre/post artifacts; prepare validates artifact configuration before building'
        required: false
        type: boolean
        default: false
      build-report-artifacts:
        description: 'Optional newline-separated subset of configured pre/post artifact names to include in the report'
        required: false
        type: string
      build-report-pr-comment:
        description: 'Publish a PR report comment; the caller must grant pull-requests write permission'
        required: false
        type: boolean
        default: false
      runner-report-default:
        description: 'Runner for Build Report; defaults to runner-default and requires Python 3.10 or newer'
        required: false
        type: string
      prepare-command:
        description: 'The prepare command to run for preparing the build (pre-steps)'
        required: false
        type: string
      just-install:
        description: 'Install just'
        required: false
        default: false
        type: boolean
      just-version:
        description: 'The version of just to install'
        required: false
        default: '1.35.0'
        type: string
      pre-checks-name:
