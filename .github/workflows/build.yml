        description: 'Runner override for post-test-coverage. Fallback chain: post-test-coverage-runner -> runner-post-default -> runner-default'
        required: false
        type: string
      post-test-coverage-docker-login:
        description: 'Login to Docker registry for post-test-coverage'
        required: false
        default: true
        type: boolean
      post-test-coverage-qemu-install:
        description: 'Setup QEMU for post-test-coverage'
        required: false
        default: false
        type: boolean
      post-test-coverage-artifact-name:
        description: 'Name of the artifact to upload for test coverage command (post-steps)'
        required: false
        type: string
      post-test-coverage-artifact-path:
        description: 'Path to the artifact to upload for test coverage command (post-steps)'
        required: false
        type: string
      post-test-coverage-artifact-overwrite:
        description: 'Whether to overwrite the artifact if it already exists for test coverage command (post-steps)'
        required: false
        type: boolean
        default: false
      post-test-coverage-artifact-if-no-files-found:
        description: 'Action to take if no files are found to upload for test coverage command (post-steps)'
        required: false
        type: string
        default: 'warn'
      post-test-coverage-artifact-retention-days:
        description: 'Number of days to retain the artifact for test coverage command (post-steps)'
        required: false
        type: number
        default: 30
      post-test-integration-name:
        description: 'Name of the post-test-integration step'
        required: false
        type: string
        default: 'Integration Test (post-steps)'
      post-test-integration-command:
        description: 'The command to run for integration testing (post-steps)'
        required: false
        type: string
      post-test-integration-runner:
        description: 'Runner override for post-test-integration. Fallback chain: post-test-integration-runner -> runner-post-default -> runner-default'
        required: false
        type: string
      post-test-integration-docker-login:
        description: 'Login to Docker registry for post-test-integration'
        required: false
        default: true
        type: boolean
      post-test-integration-qemu-install:
        description: 'Setup QEMU for post-test-integration'
        required: false
        default: false
        type: boolean
      post-test-integration-artifact-name:
        description: 'Name of the artifact to upload for integration test command (post-steps)'
        required: false
        type: string
      post-test-integration-artifact-path:
        description: 'Path to the artifact to upload for integration test command (post-steps)'
        required: false
        type: string
      post-test-integration-artifact-overwrite:
        description: 'Whether to overwrite the artifact if it already exists for integration test command (post-steps)'
        required: false
        type: boolean
        default: false
      post-test-integration-artifact-if-no-files-found:
        description: 'Action to take if no files are found to upload for integration test command (post-steps)'
        required: false
        type: string
        default: 'warn'
      post-test-integration-artifact-retention-days:
        description: 'Number of days to retain the artifact for integration test command (post-steps)'
        required: false
        type: number
        default: 30
      post-test-e2e-name:
        description: 'Name of the post-test-e2e step'
        required: false
        type: string
        default: 'E2E Test (post-steps)'
      post-test-e2e-command:
        description: 'The command to run for end-to-end testing (post-steps)'
        required: false
        type: string
      post-test-e2e-runner:
        description: 'Runner override for post-test-e2e. Fallback chain: post-test-e2e-runner -> runner-post-default -> runner-default'
        required: false
        type: string
      post-test-e2e-docker-login:
        description: 'Login to Docker registry for post-test-e2e'
        required: false
        default: true
        type: boolean
      post-test-e2e-qemu-install:
        description: 'Setup QEMU for post-test-e2e'
        required: false
        default: false
        type: boolean
      post-test-e2e-artifact-name:
        description: 'Name of the artifact to upload for e2e test command (post-steps)'
        required: false
        type: string
      post-test-e2e-artifact-path:
        description: 'Path to the artifact to upload for e2e test command (post-steps)'
        required: false
        type: string
      post-test-e2e-artifact-overwrite:
        description: 'Whether to overwrite the artifact if it already exists for e2e test command'
        required: false
        type: boolean
        default: false
      post-test-e2e-artifact-if-no-files-found:
        description: 'Action to take if no files are found to upload for e2e test command (post-steps)'
        required: false
        type: string
        default: 'warn'
      post-test-e2e-artifact-retention-days:
        description: 'Number of days to retain the artifact for e2e test command (post-steps)'
        required: false
        type: number
        default: 30
      source-artifact-name:
        description: 'Name of the artifact to upload and download for source code'
        required: false
        type: string
        default: 'source-code'
      fetch-depth:
        description: 'Number of commits to fetch. 0 indicates all history for all branches and tags'
        required: false
        type: number
        default: 0
      fetch-tags:
        description: 'Whether to fetch tags'
        required: false
        type: boolean
        default: true
      lfs:
        description: 'Whether to download Git-LFS files during checkout'
        required: false
        default: true
        type: boolean
      submodules:
        description: 'Whether to checkout submodules: true, false, or recursive'
        required: false
        type: boolean
        default: true

jobs:
  prepare:
    name: Prepare Steps
    # Inherit caller permissions so actions: read is required only when baseline lookup is enabled.
    runs-on: ${{ inputs.runner-prepare-default || inputs.runner-default }}
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      commit-sha: ${{ steps.determine_sha.outputs.sha }}
      pre-step-matrix: ${{ steps.prepare_report.outputs.pre-step-matrix }}
      pre-step-names: ${{ steps.prepare_report.outputs.pre-step-names }}
      post-step-matrix: ${{ steps.prepare_report.outputs.post-step-matrix }}
      post-step-names: ${{ steps.prepare_report.outputs.post-step-names }}
      image-platform-matrix: ${{ steps.prepare_image.outputs.matrix }}
      build-report-artifacts: ${{ steps.prepare_report.outputs.artifacts }}
      build-report-sections: ${{ steps.prepare_report.outputs.artifact-sections }}
      baseline-status: ${{ steps.baseline.outputs.status }}
    steps:
      - name: Validate versioning strategy
        shell: bash
        env:
          VERSIONING_STRATEGY: ${{ inputs.version-strategy }}
        run: |
          set -euo pipefail
          case "${VERSIONING_STRATEGY}" in
            semver|calver) ;;
            *) echo '::error::version-strategy must be semver or calver' >&2; exit 1 ;;
          esac

      - name: Prepare build inputs
        id: prepare_report
        uses: $/build/report/prepare
        with:
          build-inputs: ${{ toJSON(inputs) }}

      - name: Checkout repository
        uses: actions/checkout@v6
        id: checkout
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          fetch-tags: ${{ inputs.fetch-tags }}
          lfs: ${{ inputs.lfs }}
          submodules: ${{ inputs.submodules }}
          token: ${{ secrets.checkout-token || secrets.GITHUB_TOKEN }}

      - name: Retrieve baseline
        id: baseline
        if: inputs.baseline-enabled
        uses: $/build/baseline
        with:
          artifact-name: ${{ inputs.baseline-artifact }}
          workflow: ${{ inputs.baseline-workflow }}
          allow-ancestor: ${{ inputs.baseline-allow-ancestor }}

      - name: Share baseline with commands
        if: inputs.baseline-enabled
        uses: actions/upload-artifact@v7
        with:
          name: build-baseline-${{ inputs.source-artifact-name }}
          path: |
            ${{ steps.baseline.outputs.metadata-file }}
            ${{ steps.baseline.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Determine commit SHA
        id: determine_sha
        shell: bash
        run: |
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            echo "Using PR HEAD SHA: ${SHA}"
          else
            SHA=$(git rev-parse HEAD)
            echo "Using current HEAD SHA: ${SHA}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Next semantic version
        id: release_version_semver
        if: inputs.version-strategy == 'semver'
        uses: $/release/version/semver
        with:
          version-semver-previous: ${{ inputs.version-semver-previous }}
          version-semver-next: ${{ inputs.version-semver-next }}
          version-output-format: ${{ inputs.version-output-format }}
          version-tag-prefix: ${{ inputs.version-tag-prefix }}

      - name: Next calendar version
        id: release_version_calver
        if: inputs.version-strategy == 'calver'
        uses: $/release/version/calver
        with:
          version-output-format: ${{ inputs.version-output-format }}
          version-tag-prefix: ${{ inputs.version-tag-prefix }}

      - name: Select version outputs
        id: release_version
        shell: bash
        env:
          VERSION: ${{ steps.release_version_semver.outputs.version || steps.release_version_calver.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.release_version_semver.outputs.previous-version || steps.release_version_calver.outputs.previous-version }}
        run: |
          set -euo pipefail
          printf 'version=%s\nprevious-version=%s\n' "${VERSION}" "${PREVIOUS_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set version in file
        uses: $/version-file
        with:
          version: ${{ steps.release_version.outputs.version }}
          version-galaxy: ${{ inputs.version-galaxy }}
          version-makefile: ${{ inputs.version-makefile }}
          version-justfile: ${{ inputs.version-justfile }}
          version-package: ${{ inputs.version-package }}
          version-package-lock: ${{ inputs.version-package-lock }}
          version-script: ${{ inputs.version-script }}
          version-chart: ${{ inputs.version-chart }}

      - name: Install just
        if: inputs.just-install
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ inputs.just-version }}

      - name: Set image metadata and platform matrix
        id: prepare_image
        uses: $/buildx-bake/prepare
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          bake-file: ${{ inputs.bake-file }}
          bake-target: ${{ inputs.bake-target }}
          registry-image: ${{ inputs.registry-image }}
          docker-version: ${{ inputs.docker-version }}
          compose-version: ${{ inputs.compose-version }}
          meta-labels:
            ${{ inputs.meta-labels }}
          meta-tags: |
            type=sha,prefix=,format=long,event=push
            type=sha,event=push
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=raw,${{ steps.checkout.outputs.ref }}
            type=raw,${{ steps.checkout.outputs.commit }}
            type=raw,${{ steps.determine_sha.outputs.sha }}
            ${{ inputs.meta-tags }}

      - name: Show image build matrix
        shell: bash
        run: echo "${{ steps.prepare_image.outputs.matrix }}"

      - name: Run prepare command
        if: inputs.prepare-command != ''
        id: prepare_command
        shell: bash
        run: ${{ inputs.prepare-command }}

      - name: Verify Git LFS checkout
        if: inputs.lfs
        shell: bash
        run: |
          set -euo pipefail

          tracked_lfs_files="$(git lfs ls-files --name-only)"
          if [ -z "$tracked_lfs_files" ]; then
            echo "No Git LFS files tracked."
            exit 0
          fi

          echo "Git LFS tracked files:"
          printf '%s\n' "$tracked_lfs_files"

          git_lfs_pointer_header="version https://git-lfs.github.com/spec/v1"
          unresolved_pointers="$(
            printf '%s\n' "$tracked_lfs_files" | while IFS= read -r path; do
              [ -f "$path" ] || continue
              if head -n 1 "$path" | grep -Fxq "$git_lfs_pointer_header"; then
                printf '%s\n' "$path"
              fi
            done
          )"

          if [ -n "$unresolved_pointers" ]; then
            echo "::error::Git LFS pointer files remain in source:"
            printf '%s\n' "$unresolved_pointers"
            exit 1
          fi

          echo "Git LFS checkout verification passed."
          echo "Tracked files are hydrated before image build."

      - name: Upload updated source
        uses: eviden-actions/upload-artifact@v2
        with:
          name: ${{ inputs.source-artifact-name }}
          path: .
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  pre-steps:
    name: Pre Step
    permissions:
      contents: read
      packages: write
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.pre-step-matrix != '[]' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.pre-step-matrix)[strategy.job-index].runner || inputs.runner-pre-default || inputs.runner-default }}
    strategy:
      matrix:
        name: ${{ fromJson(needs.prepare.outputs.pre-step-names) }}
    env:
      BUILD_STEP_CONFIG: ${{ toJSON(fromJSON(needs.prepare.outputs.pre-step-matrix)[strategy.job-index]) }}
    steps:
      - name: Download updated source
        uses: atos-actions/download-artifact@v2
        with:
          name: ${{ inputs.source-artifact-name }}

      - name: Download baseline bundle
        id: baseline_bundle
        if: inputs.baseline-enabled
        uses: actions/download-artifact@v8
        with:
          name: build-baseline-${{ inputs.source-artifact-name }}
          path: ${{ runner.temp }}/build-baseline

      - name: Install just
        if: inputs.just-install
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ inputs.just-version }}

      - name: Setup Docker
        if: fromJSON(env.BUILD_STEP_CONFIG).docker-version != ''
        uses: docker/setup-docker-action@v5
        with:
          version: ${{ fromJSON(env.BUILD_STEP_CONFIG).docker-version }}

      - name: Setup Docker Compose
        if: fromJSON(env.BUILD_STEP_CONFIG).compose-version != ''
        uses: docker/setup-compose-action@v2
        with:
          version: ${{ fromJSON(env.BUILD_STEP_CONFIG).compose-version }}

      - name: Login to registry
        if: fromJSON(env.BUILD_STEP_CONFIG).docker-login == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        if: fromJSON(env.BUILD_STEP_CONFIG).qemu-install == 'true'
        uses: docker/setup-qemu-action@v4

      - name: ${{ matrix.name }}
        id: command
        env:
          BASELINE_METADATA: ${{ inputs.baseline-enabled && format('{0}/metadata.json', steps.baseline_bundle.outputs.download-path) || '' }}
          BASELINE_PATH: ${{ inputs.baseline-enabled && needs.prepare.outputs.baseline-status != 'unavailable' && format('{0}/artifacts', steps.baseline_bundle.outputs.download-path) || '' }}
        uses: $/command
        with:
          command: ${{ fromJSON(env.BUILD_STEP_CONFIG).command }}
          artifact-name: ${{ fromJSON(env.BUILD_STEP_CONFIG).artifact-name }}
          artifact-path: ${{ fromJSON(env.BUILD_STEP_CONFIG).artifact-path }}
          artifact-overwrite: ${{ fromJSON(env.BUILD_STEP_CONFIG).artifact-overwrite }}
          artifact-if-no-files-found: ${{ fromJSON(env.BUILD_STEP_CONFIG).artifact-if-no-files-found }}
          artifact-retention-days: ${{ fromJSON(env.BUILD_STEP_CONFIG).artifact-retention-days }}

  image-build:
    name: Build Image
    permissions:
      contents: read
      packages: write
    needs:
      - prepare
      - pre-steps
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.image-platform-matrix != '' && needs.prepare.outputs.image-platform-matrix != '[]' }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && (inputs.runner-build-arm64 || inputs.runner-default) || matrix.platform == 'linux/amd64' && (inputs.runner-build-amd64 || inputs.runner-default) || inputs.runner-default }}
    strategy:
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.image-platform-matrix) }}
    steps:
      - name: Download updated source
        uses: atos-actions/download-artifact@v2
        with:
          name: ${{ inputs.source-artifact-name }}

      - uses: $/buildx-bake/build
        with:
          bake-file: ${{ inputs.bake-file }}
          bake-target: ${{ inputs.bake-target }}
          qemu: ${{ inputs.qemu }}
          cache-mounts: ${{ inputs.cache-mounts }}
          cache-map: ${{ inputs.cache-map }}
          dockerfile: ${{ inputs.dockerfile }}
          cache-scope: ${{ inputs.cache-scope }}
          bake-set: ${{ inputs.bake-set }}
          registry: ${{ inputs.registry }}
          registry-image: ${{ inputs.registry-image }}
          registry-username: ${{ inputs.registry-username }}
          registry-password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}
          free-disk-space: ${{ inputs.free-disk-space }}
          docker-version: ${{ inputs.docker-version }}
          compose-version: ${{ inputs.compose-version }}

  image-push:
    name: Push Image
    permissions:
      contents: read
      packages: write
    needs:
      - prepare
      - image-build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ inputs.runner-default }}
    outputs:
      image-digests: ${{ steps.merge.outputs.image-digests }}
    steps:
      - name: Download updated source
        uses: atos-actions/download-artifact@v2
        with:
          name: ${{ inputs.source-artifact-name }}

      - uses: $/buildx-bake/merge
        id: merge
        with:
          registry-username: ${{ inputs.registry-username }}
          registry-password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}

  post-steps:
    name: Post Step
    permissions:
      contents: read
      packages: write
    needs:
      - prepare
      - image-push
    if: ${{ !failure() && !cancelled() && needs.prepare.outputs.post-step-matrix != '[]' }}
    runs-on: ${{ fromJSON(needs.prepare.outputs.post-step-matrix)[strategy.job-index].runner || inputs.runner-post-default || inputs.runner-default }}
    strategy:
      matrix:
        name: ${{ fromJson(needs.prepare.outputs.post-step-names) }}
    env:
      BUILD_STEP_CONFIG: ${{ toJSON(fromJSON(needs.prepare.outputs.post-step-matrix)[strategy.job-index]) }}
    steps:
      - name: Download updated source
        uses: atos-actions/download-artifact@v2
        with:
          name: ${{ inputs.source-artifact-name }}

      - name: Download baseline bundle
        id: baseline_bundle
        if: inputs.baseline-enabled
        uses: actions/download-artifact@v8
        with:
          name: build-baseline-${{ inputs.source-artifact-name }}
          path: ${{ runner.temp }}/build-baseline

      - name: Install just
        if: inputs.just-install
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ inputs.just-version }}

      - name: Setup Docker
        if: fromJSON(env.BUILD_STEP_CONFIG).docker-version != ''
        uses: docker/setup-docker-action@v5
        with:
          version: ${{ fromJSON(env.BUILD_STEP_CONFIG).docker-version }}

      - name: Setup Docker Compose
        if: fromJSON(env.BUILD_STEP_CONFIG).compose-version != ''
        uses: docker/setup-compose-action@v2
        with:
          version: ${{ fromJSON(env.BUILD_STEP_CONFIG).compose-version }}

      - name: Login to registry
        if: fromJSON(env.BUILD_STEP_CONFIG).docker-login == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        if: fromJSON(env.BUILD_STEP_CONFIG).qemu-install == 'true'
        uses: docker/setup-qemu-action@v4

      - name: ${{ matrix.name }}
        id: command
        env:
          BASELINE_METADATA: ${{ inputs.baseline-enabled && format('{0}/metadata.json', steps.baseline_bundle.outputs.download-path) || '' }}
          BASELINE_PATH: ${{ inputs.baseline-enabled && needs.prepare.outputs.baseline-status != 'unavailable' && format('{0}/artifacts', steps.baseline_bundle.outputs.download-path) || '' }}
        uses: $/command
        with:
          command: ${{ fromJSON(env.BUILD_STEP_CONFIG).command }}
          artifact-name: ${{ fromJSON(env.BUILD_STEP_CONFIG).artifact-name }}
          artifact-path: ${{ fromJSON(env.BUILD_STEP_CONFIG).artifact-path }}
          artifact-overwrite: ${{ fromJSON(env.BUILD_STEP_CONFIG).artifact-overwrite }}
          artifact-if-no-files-found: ${{ fromJSON(env.BUILD_STEP_CONFIG).artifact-if-no-files-found }}
          artifact-retention-days: ${{ fromJSON(env.BUILD_STEP_CONFIG).artifact-retention-days }}

  build-report:
    name: Build Report
    needs: [prepare, pre-steps, post-steps]
    if: ${{ !cancelled() && inputs.build-report-enabled && needs.prepare.result == 'success' }}
    # Inherit optional reporting scopes from the caller.
    runs-on: ${{ inputs.runner-report-default || inputs.runner-default }}
    outputs:
      artifact-url: ${{ steps.report.outputs.artifact-url }}
    steps:
      - name: Build Report
        id: report
        uses: $/build/report/publish
        with:
          artifact-names: ${{ needs.prepare.outputs.build-report-artifacts }}
          artifact-sections: ${{ needs.prepare.outputs.build-report-sections }}
          pr-comment: ${{ inputs.build-report-pr-comment }}
