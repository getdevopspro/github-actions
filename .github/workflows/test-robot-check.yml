name: Robot Test Check

on:
  workflow_call:
    inputs:
      label-test-robot-done:
        description: 'Label name indicating the PR has been test-robot-done'
        type: string
        required: false
        default: 'test-robot-done'
      label-test-robot-needed:
        description: 'Label name indicating the PR needs robot testing'
        type: string
        required: false
        default: 'test-robot-needed'
      post-comment:
        description: 'Whether to post a comment on the PR'
        required: false
        default: false
        type: boolean
    secrets:
      token:
        description: 'GitHub token or PAT'
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  test-robot-check-labels:
    name: Robot Test Check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Robot Test Check
        uses: clean-botix/github-actions/test/label/check@v5.1.0
        with:
          label-done: ${{ inputs.label-test-robot-done }}
          label-needed: ${{ inputs.label-test-robot-needed }}
          test-name: Robot
          post-comment: ${{ inputs.post-comment }}
          token: ${{ secrets.token }}
