name: "Prepare Build Matrix & Metadata"
description: "Generate platform matrix and bake metadata file for later steps."
inputs:
  bake-file:
    description: 'The bake file'
    required: false
    default: 'docker-bake.hcl'
  bake-target:
    description: 'Target name for `docker buildx bake`'
    required: false
    default: 'build'
  meta-tags:
    description: 'The tags to add to the image'
    required: false
  meta-labels:
    description: 'The labels to add to the image'
    required: false
  registry-image:
    description: 'Container registry + image prefix (e.g. ghcr.io/org/repo)'
    required: false
  docker-version:
    description: 'Docker CE version. (e.g, v24.0.9)'
    required: false
    default: ''
  compose-version:
    description: 'Compose version. (eg. v2.32.4)'
    required: false
    default: ''
outputs:
  matrix:
    description: 'JSON array of platforms'
    value: ${{ steps.platforms.outputs.matrix }}
runs:
  using: "composite"
  steps:
    - name: Convert registry-image to lowercase
      shell: bash
      id: lowercase_registry_image
      run: |
        echo "registry-image=${{ inputs.registry-image }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

    - name: Setup Docker
      uses: docker/setup-docker-action@v5
      if: ${{ inputs.docker-version != '' }}
      with:
        version: ${{ inputs.docker-version }}

    - name: Setup Docker Compose
      uses: docker/setup-compose-action@v2
      if: ${{ inputs.compose-version != '' }}
      with:
        version: ${{ inputs.compose-version }}

    - name: Create matrix
      id: platforms
      shell: bash
      env:
        BAKE_FILE: ${{ inputs.bake-file }}
        BAKE_TARGET: ${{ inputs.bake-target }}
      run: |
        set -euo pipefail
        MATRIX=$(docker buildx bake --file "$BAKE_FILE" "$BAKE_TARGET" \
          --print | jq -c '.target | to_entries | map(.value.platforms[]) | unique')
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

    - name: Show matrix
      shell: bash
      run: echo ${{ steps.platforms.outputs.matrix }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.lowercase_registry_image.outputs.registry-image }}
        tags: ${{ inputs.meta-tags }}
        labels: ${{ inputs.meta-labels }}

    - name: Rename meta file
      shell: bash
      run: |
        mv "${{ steps.meta.outputs.bake-file }}" "${{ runner.temp }}/bake-meta.json"

    - name: Upload meta bake file
      uses: actions/upload-artifact@v7
      with:
        name: bake-meta
        path: ${{ runner.temp }}/bake-meta.json
        if-no-files-found: error
        retention-days: 1
