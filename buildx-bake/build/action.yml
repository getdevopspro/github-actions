name: "Build & Push Images"
description: "Download metadata, build multi‑arch images, push by digest, and upload per‑platform digests."
inputs:
  bake-file:
    description: 'The bake file'
    required: false
    default: 'docker-bake.hcl'
  bake-target:
    description: 'Target name for `docker buildx bake`'
    required: false
    default: 'build'
  cache-scope:
    description: 'Layer-cache prefix; target name and platform are appended (letters, digits, dots, underscores, hyphens)'
    required: false
    default: 'buildkit'
  bake-set:
    description: 'Newline-separated Bake overrides, applied after the action defaults'
    required: false
    default: ''
  registry:
    description: 'The container registry'
    required: false
    default: 'ghcr.io'
  registry-username:
    description: 'The container registry username'
    required: true
    default: ${{ github.actor }}
  registry-password:
    description: 'The container registry password'
    required: true
  registry-image:
    description: 'Container registry + image prefix'
    required: false
  docker-version:
    description: 'Docker CE version. (e.g, v24.0.9)'
    required: false
    default: ''
  compose-version:
    description: 'Compose version. (eg. v2.32.4)'
    required: false
    default: ''
  free-disk-space:
    description: 'Free disk space before build'
    required: false
    default: "false"
  cache-mounts:
    description: 'Persist Dockerfile cache mounts between builds'
    required: false
    default: 'true'
  cache-map:
    description: 'Optional JSON map of cache-mount/<name> archive paths to resolved mount options; replaces discovery'
    required: false
    default: ''
  dockerfile:
    description: "The Dockerfile to use for auto-discovery of the cache-map. Default: `Dockerfile`"
    default: "Dockerfile"
    required: false
outputs:
  metadata:
    description: 'The bake metadata of the built image'
    value: ${{ steps.bake.outputs.metadata }}
runs:
  using: "composite"
  steps:
    - name: Convert registry-image to lowercase
      shell: bash
      id: lowercase_registry_image
      run: |
        echo "registry-image=${{ inputs.registry-image }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

    - name: Prepare env
      shell: bash
      run: |
        platform=${{ matrix.platform }}
        echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

    - name: Setup Docker
      uses: docker/setup-docker-action@v5
      if: ${{ inputs.docker-version != '' }}
      with:
        version: ${{ inputs.docker-version }}

    - name: Setup Docker Compose
      uses: docker/setup-compose-action@v2
      if: ${{ inputs.compose-version != '' }}
      with:
        version: ${{ inputs.compose-version }}

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.1
      if: ${{ inputs.free-disk-space == true }}
      with:
        tool-cache: true

    - name: Download meta bake file
      uses: actions/download-artifact@v8
      with:
        name: bake-meta
        path: ${{ runner.temp }}

    - name: Login to registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4
      id: setup-buildx

    - name: Prepare Bake defaults
      shell: bash
      env:
        BAKE_FILE: ${{ inputs.bake-file }}
        BAKE_TARGET: ${{ inputs.bake-target }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        NO_TAG: true
      run: |
        set -euo pipefail
        if [[ ! "$CACHE_SCOPE" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
          echo "::error::cache-scope must contain only letters, digits, dots, underscores or hyphens"
          exit 1
        fi
        docker buildx bake --file "$BAKE_FILE" --file "$RUNNER_TEMP/bake-meta.json" \
          "$BAKE_TARGET" --print | jq --arg prefix "$CACHE_SCOPE" --arg platform "$PLATFORM_PAIR" '
          {target: (.target | with_entries(
            .value = {
              "cache-from": ["type=gha,scope=" + $prefix + "-" + .key + "-" + $platform],
              "cache-to": ["type=gha,scope=" + $prefix + "-" + .key + "-" + $platform + ",mode=max,ignore-error=true"],
              "output": ["type=image,push-by-digest=true,name-canonical=true,push=true"]
            }
          ))}' > "$RUNNER_TEMP/bake-defaults.json"

    - name: Prepare cache-mount configuration
      if: ${{ inputs.cache-mounts == 'true' }}
      id: cache-config
      shell: bash
      env:
        CACHE_MAP: ${{ inputs.cache-map }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        BUILD_PLATFORM: ${{ matrix.platform }}
        BAKE_TARGET: ${{ inputs.bake-target }}
        BUILD_FILES_HASH: ${{ hashFiles(inputs.dockerfile, inputs.bake-file) }}
      run: bash "$GITHUB_ACTION_PATH/cache-config.sh"

    - name: Cache docker cache mounts
      if: ${{ inputs.cache-mounts == 'true' }}
      uses: actions/cache@v5
      id: cache
      with:
        path: cache-mount
        key: ${{ steps.cache-config.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        restore-keys: ${{ steps.cache-config.outputs.prefix }}

    - name: Restore docker cache mounts
      if: ${{ inputs.cache-mounts == 'true' }}
      uses: reproducible-containers/buildkit-cache-dance@v3
      with:
        builder: ${{ steps.setup-buildx.outputs.name }}
        cache-dir: cache-mount
        cache-map: ${{ steps.cache-config.outputs.cache-map }}
        dockerfile: ${{ inputs.dockerfile }}
        skip-extraction: ${{ steps.cache.outputs.cache-hit }}

    - name: Build & push images
      id: bake
      uses: docker/bake-action@v7
      env:
        NO_TAG: true
        PLATFORM_PAIR: ${{ env.PLATFORM_PAIR }}
      with:
        source: .
        files: |
          ./${{ inputs.bake-file }}
          cwd://${{ runner.temp }}/bake-meta.json
          cwd://${{ runner.temp }}/bake-defaults.json
        targets: ${{ inputs.bake-target }}
        set: |
          ${{ steps.lowercase_registry_image.outputs.registry-image != '' && format('*.tags={0}', steps.lowercase_registry_image.outputs.registry-image) || '' }}
          *.platform=${{ matrix.platform }}
          ${{ inputs.bake-set }}

    - name: Export container digests
      id: digests
      shell: bash
      run: |
        cat << '_BAKE_METADATA' > ${{ runner.temp }}/bake-metadata.json
        ${{ steps.bake.outputs.metadata }}
        _BAKE_METADATA
        mkdir -p ${{ runner.temp }}/digests
        jq 'with_entries(select(.value["containerimage.digest"]?) | .value |= {name: .["image.name"], digests:[.["containerimage.digest"]]})' ${{ runner.temp }}/bake-metadata.json > ${{ runner.temp }}/digests/${{ env.PLATFORM_PAIR }}.json

        echo "has-digests=$(jq 'length > 0' '${{ runner.temp }}/digests/${{ env.PLATFORM_PAIR }}.json')" >> "$GITHUB_OUTPUT"

    - name: Upload digest
      if: ${{ steps.digests.outputs.has-digests == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
